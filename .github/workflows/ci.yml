# RNF-033: ninguna versión se publica si alguna prueba falla.
name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: scouttracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scout" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://scout:scout@localhost:5432/scouttracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
        working-directory: apps/mobile
      - run: npm test
