# Base de datos para desarrollo y pruebas locales: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scouttracker
    ports:
      - '5432:5432'
    volumes:
      - datos:/var/lib/postgresql/data
      - ./apps/server/scripts/crear-base-pruebas.sql:/docker-entrypoint-initdb.d/crear-base-pruebas.sql:ro
volumes:
  datos:
